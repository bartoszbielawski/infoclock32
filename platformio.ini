; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio.local.ini

[common]
platform = espressif32 @ ^6.5.0
framework = arduino
lib_deps =
    https://github.com/bartoszbielawski/LEDMatrixDriver.git#explicit-spi
    adafruit/Adafruit GFX Library@^1.12.3
    LittleFS
    ArduinoJson
    AJSP
    knolleary/PubSubClient
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit AHTX0
    adafruit/Adafruit Unified Sensor
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    links2004/WebSockets @ ^2.4.1
board_build.filesystem = littlefs
monitor_speed = 1000000

; ── ESP32-C3 ─────────────────────────────────────────────────────────────────
; RISC-V, HWCDC (USB Serial/JTAG peripheral), built-in LED on GPIO8
[env:esp32-c3-devkitm-1]
extends = common
board = esp32-c3-devkitm-1
upload_protocol = esp-builtin
monitor_speed = 115200  ; HWCDC ignores baud rate but avoids inheriting 1000000 from common
board_build.f_cpu = 160000000L
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_ADAFRUIT_GFX

; ── ESP32 (original) ─────────────────────────────────────────────────────────
; Xtensa LX6, no native USB (UART chip), built-in LED on GPIO2
[env:esp32dev]
extends = common
board = esp32dev
build_flags =
    -DUSE_ADAFRUIT_GFX

; ── ESP32-S2 ─────────────────────────────────────────────────────────────────
; Xtensa LX7, USB OTG / TinyUSB only (no HWCDC), no simple built-in LED on Saola
; Adjust LED_BLINK_PIN in include/pins.hpp to match your board
[env:esp32-s2-saola-1]
extends = common
board = esp32-s2-saola-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ADAFRUIT_GFX

; ── ESP32-S3 ─────────────────────────────────────────────────────────────────
; Xtensa LX7 dual-core, HWCDC (USB Serial/JTAG) + USB OTG; using HWCDC like C3
; DevKitC-1 rev N8R8 has RGB LED on GPIO48; GPIO2 used here for simple blink
[env:esp32-s3-devkitc-1]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_ADAFRUIT_GFX
