; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio.local.ini

[common]
; Exact platform too: it fixes the Arduino core (2.0.x), whose CA bundle
; format certs/x509_crt_bundle.bin is built for.
platform = espressif32 @ 6.13.0
framework = arduino
lib_deps =
    ; Exact versions: a rebuild must produce the same firmware. Bump on purpose
    ; (pio pkg outdated shows what's newer), then run the host tests + builds.
    ; GitHub dependencies are pinned to a commit via its source archive (a
    ; '#<sha>' on a git URL fails for commits off the default branch).
    ; LEDMatrixDriver: tip of the explicit-spi branch.
    https://github.com/bartoszbielawski/LEDMatrixDriver/archive/4485b008fbd1b5241e19424c0ae0ac20a677b8ec.zip
    tzapu/WiFiManager@2.0.17
    adafruit/Adafruit GFX Library@1.12.6
    ; LittleFS is the Arduino core's built-in library (no version to pin)
    LittleFS
    bblanchon/ArduinoJson@7.4.3
    bartoszbielawski/AJSP@0.1.2
    knolleary/PubSubClient@2.8.0
    adafruit/Adafruit BMP085 Library@1.2.4
    adafruit/Adafruit BMP280 Library@3.0.0
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit VEML7700 Library@2.1.6
    adafruit/Adafruit Unified Sensor@1.1.15
    ; transitive dependencies of the Adafruit libraries, pinned too
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit SH110X@2.1.15
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    https://github.com/Sensirion/arduino-core/archive/6c087aae9e11c66e2b01a0c79d9f1632e1821b65.zip
    https://github.com/Sensirion/arduino-i2c-scd4x/archive/460ca2815c8a91c373b73bbb9af21e9fe275a455.zip
    links2004/WebSockets@2.7.3
extra_scripts = pre:build_stamp.py, post:merge_bin.py
board_build.filesystem = littlefs
; Root CAs for HTTPS verification (tls_verify=1); see certs/README.md
board_build.embed_files = certs/x509_crt_bundle.bin
board_build.partitions = min_spiffs.csv
monitor_speed = 1000000

; ── ESP32-C3 ─────────────────────────────────────────────────────────────────
; RISC-V, HWCDC (USB Serial/JTAG peripheral), built-in LED on GPIO8
[env:esp32-c3-devkitm-1]
extends = common
board = esp32-c3-devkitm-1
upload_protocol = esp-builtin
monitor_speed = 115200  ; HWCDC ignores baud rate but avoids inheriting 1000000 from common
board_build.f_cpu = 160000000L
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_ADAFRUIT_GFX

; ── ESP32 (original) ─────────────────────────────────────────────────────────
; Xtensa LX6, no native USB (UART chip), built-in LED on GPIO2
[env:esp32dev]
extends = common
board = esp32dev
build_flags =
    -DUSE_ADAFRUIT_GFX

; ── ESP32-S2 ─────────────────────────────────────────────────────────────────
; Xtensa LX7, USB OTG / TinyUSB only (no HWCDC), no simple built-in LED on Saola
; Adjust LED_BLINK_PIN in include/pins.hpp to match your board
[env:esp32-s2-saola-1]
extends = common
board = esp32-s2-saola-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ADAFRUIT_GFX

; ── ESP32-S3 ─────────────────────────────────────────────────────────────────
; Xtensa LX7 dual-core, HWCDC (USB Serial/JTAG) + USB OTG; using HWCDC like C3
; DevKitC-1 rev N8R8 has RGB LED on GPIO48; GPIO2 used here for simple blink
[env:esp32-s3-devkitc-1]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_ADAFRUIT_GFX
