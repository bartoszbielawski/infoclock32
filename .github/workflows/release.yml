name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-c3-devkitm-1, esp32-s2-saola-1, esp32-s3-devkitc-1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - name: Name binaries with the release tag
        run: |
          cd dist
          for f in firmware-*.bin; do
            mv "$f" "infoclock32-${GITHUB_REF_NAME}-${f#firmware-}"
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.bin
          generate_release_notes: true
