name: Pages

# Publishes the browser tools (tools/serial_setup.html) on GitHub Pages:
#   https://bartoszbielawski.github.io/infoclock32/
# One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'tools/serial_setup.html'
      - 'tools/config_keys.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site
          cp tools/serial_setup.html tools/config_keys.js _site/
          # The site root opens the serial setup page too.
          cp tools/serial_setup.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
